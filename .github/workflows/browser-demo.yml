name: Browser Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: academic-performance-browser-demo
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test Java application
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Prepare browser distribution
        run: |
          rm -rf dist
          mkdir -p dist
          cp web/index.html dist/index.html
          test -f target/original-academic-performance-calculator.jar
          cp target/original-academic-performance-calculator.jar dist/academic-performance-calculator.jar
          touch dist/.nojekyll

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Chromium smoke-test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Smoke test CheerpJ browser launcher
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/browser-demo-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            page.on('console', message => console.log('[browser console]', message.type(), message.text()));
            page.on('pageerror', error => console.error('[browser pageerror]', error));

            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded',
              timeout: 120000,
            });

            try {
              await page.waitForFunction(
                () => window.__academicDemoJavaReady || window.__academicDemoError,
                null,
                { timeout: 180000 }
              );

              if (await page.evaluate(() => window.__academicDemoError || '')) {
                throw new Error(await page.evaluate(() => window.__academicDemoError));
              }

              await page.waitForTimeout(2000);

              const state = await page.evaluate(() => ({
                started: Boolean(window.__academicDemoLaunchStarted),
                javaReady: Boolean(window.__academicDemoJavaReady),
                stage: window.__academicDemoStage || '',
                displayCreated: Boolean(window.__academicDemoDisplayCreated),
                displayPresent: Boolean(document.getElementById('cheerpj-display')),
                containerChildren: document.querySelector('#container')?.children.length || 0,
                status: document.getElementById('status')?.textContent || '',
              }));

              if (!state.started || !state.javaReady || state.stage !== 'login' || !state.displayCreated || !state.displayPresent || state.containerChildren < 1) {
                throw new Error('Java Swing login did not become ready in CheerpJ: ' + JSON.stringify(state));
              }
              console.log('Browser demo smoke state:', state);
            } catch (error) {
              const debugState = await page.evaluate(() => ({
                started: Boolean(window.__academicDemoLaunchStarted),
                javaReady: Boolean(window.__academicDemoJavaReady),
                stage: window.__academicDemoStage || '',
                error: window.__academicDemoError || '',
                displayCreated: Boolean(window.__academicDemoDisplayCreated),
                displayPresent: Boolean(document.getElementById('cheerpj-display')),
                status: document.getElementById('status')?.textContent || '',
                loadingText: document.getElementById('loading')?.innerText || '',
              }));
              console.error('Browser demo debug state:', debugState);
              throw error;
            } finally {
              await page.screenshot({ path: 'browser-demo.png', fullPage: true });
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload browser-demo screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: academic-performance-browser-demo
          path: browser-demo.png
          if-no-files-found: warn
          retention-days: 7

      - name: Publish gh-pages branch
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy browser demo from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
