name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile, test and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload runnable demo JAR
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: academic-performance-calculator
          path: target/academic-performance-calculator.jar
          if-no-files-found: error
