name: Java compile check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile dissertation source
        run: |
          mkdir -p build
          javac -d build \
            src/DBConnector.java \
            src/DecisionTree.java \
            src/LoginWindow.java \
            src/MainWindow.java \
            src/Module.java \
            src/ModuleDAO.java \
            src/RandomForestModel.java \
            src/RandomForestRegressor.java
